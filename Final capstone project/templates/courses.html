<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Recommendations - AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-graduation-cap"></i> Course Recommendations</h1>
            <p>Upskill yourself for the <b>{{ role }}</b> role</p>
        </header>

        <main>
            <div class="card">
                <h3>Recommended Learning Paths</h3>
                <div class="courses-list">
                    {% for course in data.courses %}
                    <div class="course-item card" style="margin-bottom: 1rem; border-left: 5px solid var(--primary-color);">
                        <h4>{{ course.title }}</h4>
                        <p>Platform: <b>{{ course.platform }}</b></p>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="actions">
                <a href="/" class="btn-primary" style="text-decoration: none; display: inline-block; width: auto;">Back to Dashboard</a>
            </div>
        </main>
    </div>
</body>
</html>
