<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResumeAI - AI-Powered Resume Analyzer & Career Guidance{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-3.5.1.min.js"></script>
    <style>
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .sidebar-enter { animation: slideIn 0.3s ease-out; }
        .content-enter { animation: fadeIn 0.5s ease-out; }
        
        .hover-scale {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .hover-scale:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        body {
            color: var(--text-color);
            line-height: 1.6;
        }
        
        .sidebar-item {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        
        .sidebar-item:hover::before,
        .sidebar-item.active::before {
            transform: translateX(0);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .typing-effect {
            overflow: hidden;
            border-right: 2px solid #667eea;
            white-space: nowrap;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #667eea }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gradient-to-b from-gray-900 to-gray-800 shadow-xl sidebar-enter">
            <div class="p-6 gradient-bg">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                        <i class="fas fa-brain text-purple-600 text-xl"></i>
                    </div>
                    <h1 class="text-white text-xl font-bold">ResumeAI</h1>
                </div>
                <p class="text-purple-100 text-sm mt-2">Smart Resume Analysis</p>
            </div>
            
            <nav class="mt-6">
                <a href="/" class="sidebar-item flex items-center px-6 py-3 text-gray-300 hover:bg-purple-900 hover:text-white {% if request.endpoint == 'index' %}active bg-purple-900 text-white{% endif %}">
                    <i class="fas fa-home w-5 mr-3"></i>
                    <span>Home</span>
                </a>
                <a href="/dashboard" class="sidebar-item flex items-center px-6 py-3 text-gray-300 hover:bg-purple-900 hover:text-white {% if request.endpoint == 'dashboard' %}active bg-purple-900 text-white{% endif %}">
                    <i class="fas fa-chart-line w-5 mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/analyzer" class="sidebar-item flex items-center px-6 py-3 text-gray-300 hover:bg-purple-900 hover:text-white {% if request.endpoint == 'analyzer' %}active bg-purple-900 text-white{% endif %}">
                    <i class="fas fa-file-alt w-5 mr-3"></i>
                    <span>Resume Analyzer</span>
                </a>
                <a href="/ml-insights" class="sidebar-item flex items-center px-6 py-3 text-gray-300 hover:bg-purple-900 hover:text-white {% if request.endpoint == 'ml_insights' %}active bg-purple-900 text-white{% endif %}">
                    <i class="fas fa-robot w-5 mr-3"></i>
                    <span>ML Insights</span>
                </a>
                <a href="/about" class="sidebar-item flex items-center px-6 py-3 text-gray-300 hover:bg-purple-900 hover:text-white {% if request.endpoint == 'about' %}active bg-purple-900 text-white{% endif %}">
                    <i class="fas fa-info-circle w-5 mr-3"></i>
                    <span>About</span>
                </a>
            </nav>
            
            <div class="absolute bottom-0 w-64 border-t border-gray-700 bg-gray-900">
                <div class="px-6 py-4">
                    <button id="theme-toggle" class="flex items-center justify-between w-full text-gray-400 hover:text-white transition-colors">
                        <span class="flex items-center text-sm font-medium">
                            <i id="theme-icon" class="fas fa-moon mr-3"></i>
                            <span id="theme-text">Dark Mode</span>
                        </span>
                        <div class="w-8 h-4 bg-gray-700 rounded-full relative border border-gray-600">
                            <div id="theme-dot" class="w-3 h-3 bg-gray-300 rounded-full absolute top-[1px] left-[2px] transition-transform duration-200"></div>
                        </div>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Animate cards on scroll
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };
            
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('content-enter');
                    }
                });
            }, observerOptions);
            
            document.querySelectorAll('.card-hover').forEach(card => {
                observer.observe(card);
            });

            // Dark Mode Toggle Logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            const themeDot = document.getElementById('theme-dot');
            
            function applyTheme(theme) {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    themeIcon.className = 'fas fa-sun text-yellow-400 mr-3';
                    themeText.textContent = 'Light Mode';
                    themeDot.style.transform = 'translateX(14px)';
                    themeDot.classList.replace('bg-gray-300', 'bg-yellow-400');
                } else {
                    document.documentElement.classList.remove('dark');
                    themeIcon.className = 'fas fa-moon mr-3';
                    themeText.textContent = 'Dark Mode';
                    themeDot.style.transform = 'translateX(0px)';
                    themeDot.classList.replace('bg-yellow-400', 'bg-gray-300');
                }
            }
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);
            
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
