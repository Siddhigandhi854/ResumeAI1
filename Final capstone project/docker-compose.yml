version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      # Do not sync node_modules or python virtual envs if present locally
      - /app/venv
      - /app/uploads
    environment:
      - FLASK_ENV=development
      - PORT=5000
    restart: always
